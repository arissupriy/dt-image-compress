name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.88.0", stable]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy,rustfmt
      - run: cargo +${{ matrix.toolchain }} fmt --check
      - run: cargo +${{ matrix.toolchain }} test --locked
      - run: cargo +${{ matrix.toolchain }} test --locked --all-features --all-targets
      - run: cargo +${{ matrix.toolchain }} clippy --locked --all-targets --all-features -- -D warnings
      - run: python3 tools/benchmark.py --self-test
