name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  evaluation-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install -r tools/requirements-evaluation.txt
      - run: .venv/bin/python -m unittest discover -s tools -p 'test_jpeg_*.py'
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.88.0", stable]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy,rustfmt
      - run: cargo +${{ matrix.toolchain }} fmt --check
      - run: cargo +${{ matrix.toolchain }} test --locked
      - run: cargo +${{ matrix.toolchain }} test --locked --features cli,experimental-prefilter --all-targets
      - run: cargo +${{ matrix.toolchain }} clippy --locked --all-targets --features cli,experimental-prefilter -- -D warnings
      - run: python3 tools/benchmark.py --self-test
  native-jpeg:
    runs-on: ubuntu-latest
    env:
      TURBOJPEG_DYNAMIC: "1"
      TURBOJPEG_STATIC: "0"
      TURBOJPEG_SOURCE: vendor
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo +stable test --locked --all-features --all-targets
      - run: cargo +stable test --locked --all-features --doc
      - run: cargo +stable clippy --locked --all-features --all-targets -- -D warnings
